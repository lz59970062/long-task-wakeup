site_name: Long Task Callback
site_description: 长任务结束后，让 Agent 回到原会话继续工作。
site_url: !ENV [LTC_DOCS_SITE_URL, 'https://lz59970062.github.io/long-task-wakeup/']
repo_url: https://github.com/lz59970062/long-task-wakeup
repo_name: lz59970062/long-task-wakeup
edit_uri: edit/main/docs/
strict: true
validation:
  links:
    anchors: warn
    unrecognized_links: warn
theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/timer-outline
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
plugins:
  - search
markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
# Engineering notes stay alongside the source; the public guide links to them.
exclude_docs: |
  /*.md
  !/index.md
  !/installation.md
  !/quickstart.md
  !/overview.md
  !/troubleshooting.md
  /requirements.txt
nav:
  - 首页: index.md
  - 入门:
      - 安装: installation.md
      - 第一个任务: quickstart.md
      - 架构概览: overview.md
  - 使用指南:
      - 运行命令: guides/run.md
      - 启动子 Agent: guides/agents.md
      - 接入已有任务: guides/external-jobs.md
      - 接收与确认回调: guides/callbacks.md
      - 编写任务模板: guides/templates.md
      - 跟踪多阶段目标: guides/goals.md
  - Agent 接入:
      - Codex CLI: integrations/codex.md
      - Claude Code: integrations/claude.md
      - Pi: integrations/pi.md
      - Codex Desktop: integrations/desktop.md
  - 参考:
      - 命令速查: reference/cli.md
      - 配置与文件位置: reference/configuration.md
      - 常见问题: troubleshooting.md
      - 开发资料: reference/engineering.md
      - 参与文档维护: reference/contributing.md
      - 版本记录: https://github.com/lz59970062/long-task-wakeup/blob/main/CHANGELOG.md
